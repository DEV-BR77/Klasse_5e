[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "klasse5e-vision"
version = "0.1.0"
description = "Local collection-isolated human-in-the-loop face matching API."
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.16.5",
  "fastapi==0.116.1",
  "numpy==2.2.6",
  "onnxruntime==1.22.1",
  "opencv-contrib-python-headless==4.12.0.88",
  "pillow==11.3.0",
  "pydantic-settings==2.10.1",
  "python-multipart==0.0.20",
  "sqlalchemy==2.0.43",
  "uvicorn==0.35.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.2",
  "ruff==0.12.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vision_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
