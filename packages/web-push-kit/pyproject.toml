[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "klasse5e-web-push-kit"
version = "0.1.0"
description = "Framework-neutral Web Push delivery primitives and browser helpers."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pywebpush==2.4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/web_push_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
