[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "klasse-5e-app"
version = "0.3.0b3"
requires-python = ">=3.12,<3.13"
dependencies = [
  "Django==5.2.17",
  "Wagtail==7.2.3",
  "django-allauth[mfa]==65.19.1",
  "django-ratelimit==4.1.0",
  "gunicorn==23.0.0",
  "psycopg[binary]==3.3.4",
  "whitenoise==6.12.0",
  "Pillow==12.3.0",
  "pdfplumber==0.11.7",
  "reportlab==4.4.4",
  "qrcode==8.2",
  "cryptography>=47.0.0,<51.0.0",
  "playwright==1.55.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "pytest-django==4.11.1", "ruff==0.12.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/klasse5e"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "klasse5e.settings"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
