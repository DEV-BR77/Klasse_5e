{% extends "base.html" %}
{% block content %}
<section class="content-card onboarding-card" aria-labelledby="tutorial-title">
  <p class="eyebrow">Optionales Tutorial · {{ step }} von {{ total_steps }}</p>
  <progress value="{{ step }}" max="{{ total_steps }}">{{ step }} von {{ total_steps }}</progress>
  <h1 id="tutorial-title">{{ title }}</h1>
  <p>{{ body }}</p>
  <form method="post" class="form-actions">
    {% csrf_token %}
    {% if step > 1 %}<a class="button secondary" href="{% url 'tutorial-step' step=step|add:'-1' %}">Zurück</a>{% endif %}
    <button type="submit" name="action" value="next">{% if step == total_steps %}Tutorial beenden{% else %}Weiter{% endif %}</button>
    <button class="secondary" type="submit" name="action" value="dismiss">Überspringen</button>
  </form>
</section>
{% endblock %}
