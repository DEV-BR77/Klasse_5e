{% extends "base.html" %}{% block content %}<section class="settings-page"><header class="page-heading"><div><p class="eyebrow">Portalverwaltung</p><h1>Menü strukturieren</h1><p class="lede">Gruppennamen, Zuordnung und Reihenfolge für diese Klasse festlegen.</p></div></header><form method="post" class="form-stack">{% csrf_token %}<article class="settings-panel"><header><h2>Gruppennamen</h2></header><div class="settings-details-body field-pair"><label>Klassenleben<input name="label_class" value="{{ stored.group_labels.class|default:'Klassenleben' }}"></label><label>Kommunikation<input name="label_communication" value="{{ stored.group_labels.communication|default:'Kalender & Kommunikation' }}"></label><label>Konto<input name="label_account" value="{{ stored.group_labels.account|default:'Mein Konto' }}"></label></div></article><article class="settings-panel"><header><h2>Menüpunkte</h2></header>{% for row in rows %}<div class="menu-admin-row"><strong>{{ row.label }}</strong><select name="group_{{ row.key }}"><option value="class" {% if row.group == 'class' %}selected{% endif %}>Klassenleben</option><option value="communication" {% if row.group == 'communication' %}selected{% endif %}>Kommunikation</option><option value="account" {% if row.group == 'account' %}selected{% endif %}>Mein Konto</option></select><label><span class="sr-only">Position</span><input type="number" min="1" max="99" name="position_{{ row.key }}" value="{{ row.position }}"></label></div>{% endfor %}</article><button class="button button-primary">Menü speichern</button></form></section>{% endblock %}
