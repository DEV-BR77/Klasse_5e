{% extends "base.html" %}{% block content %}<section><header class="page-title-row"><h1>Veranstaltungen</h1>{% if can_manage_portal %}<details><summary class="button button-primary">Veranstaltung anlegen</summary><form method="post" class="content-card">{% csrf_token %}<label>Titel<input name="title" maxlength="200" required></label><label>Beschreibung<textarea name="description" rows="4" required></textarea></label><label>Ort<input name="location" maxlength="200" required></label><label>Beginn<input type="datetime-local" name="starts_at" required></label><label>Ende<input type="datetime-local" name="ends_at" required></label><button class="button button-primary" type="submit">Veröffentlichen</button></form></details>{% endif %}</header><div class="card-grid">{% for item in events %}<article class="content-card"><h2><a href="/mehr/veranstaltungen/{{ item.id }}/">{{ item.title }}</a></h2><p>{{ item.starts_at }}</p></article>{% empty %}<p class="empty-state">Keine Veranstaltungen.</p>{% endfor %}</div></section>{% endblock %}
