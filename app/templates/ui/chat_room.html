{% extends "base.html" %}{% block content %}<section><h1>{{ room.title }}</h1><ol class="message-list">{% for message in messages %}<li class="content-card"><p>{{ message.body }}</p><small>{{ message.created_at }}</small></li>{% empty %}<li>Keine Nachrichten.</li>{% endfor %}</ol>{% if room.is_open %}<form method="post" class="content-card chat-composer">{% csrf_token %}<label>Nachricht<textarea name="body" rows="4" maxlength="2000" required placeholder="Nachricht schreiben … Emojis wie 😊 sind möglich."></textarea></label><div><button type="button" class="button" onclick="this.form.body.value += ' 😊'" aria-label="Lächelndes Emoji einfügen">😊</button> <button type="button" class="button" onclick="this.form.body.value += ' 👍'" aria-label="Daumen hoch einfügen">👍</button> <button class="button button-primary" type="submit">Senden</button></div></form>{% endif %}</section>{% endblock %}
