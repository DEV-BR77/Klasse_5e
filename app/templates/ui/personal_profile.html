{% extends "base.html" %}{% block content %}<section class="flow-page"><a class="back-link" href="/">← Home</a><h1>Persönliches Profil</h1><form method="post" enctype="multipart/form-data" class="form-stack">{% csrf_token %}<div class="card"><h2>Über dich</h2><label>Vorname<input name="first_name" value="{{ person.first_name }}" required></label><label>Nachname<input name="last_name" value="{{ person.last_name }}" required></label><label>Straße<input name="street" value="{{ person.street }}" autocomplete="street-address"></label><label>Postleitzahl<input name="postal_code" value="{{ person.postal_code }}" inputmode="numeric"></label><label>Ort<input name="city" value="{{ person.city }}"></label><label>Telefon<input name="phone" value="{{ person.phone }}" type="tel"></label><label>Profilfoto<input name="profile_photo" type="file" accept="image/png,image/jpeg,image/webp"></label><p class="hint">Das Bild wird neu codiert; EXIF- und GPS-Metadaten werden entfernt.</p></div><fieldset class="card"><legend>Kontaktverzeichnis</legend><label class="choice-card"><input type="checkbox" name="share_email" value="yes" {% if person.email_visibility == 'members' %}checked{% endif %}><strong>E-Mail freigeben</strong><span>{{ request.user.email }}</span></label><label class="choice-card"><input type="checkbox" name="share_phone" value="yes" {% if person.phone_visibility == 'members' %}checked{% endif %}><strong>Telefon freigeben</strong><span>Getrennt und freiwillig</span></label></fieldset><button class="button button-primary">Profil speichern</button></form></section>{% endblock %}
