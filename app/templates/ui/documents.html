{% extends "base.html" %}{% block content %}<section><h1>Dokumente</h1><form method="get" role="search"><label for="document-search">Dokumente durchsuchen</label><input id="document-search" name="q" value="{{ search }}"><button>Suchen</button></form><ul class="card-grid">{% for item in documents %}<li class="content-card"><h2>{{ item.title }}</h2><p>{{ item.description }}</p></li>{% empty %}<li class="empty-state">Keine Dokumente.</li>{% endfor %}</ul></section>{% endblock %}
