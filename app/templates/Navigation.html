<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KlassID - Portal-Navigation</title>
    <!-- Tailwind CSS CDN für das visuelle Styling -->
    <script src="https://tailwindcss.com"></script>
    <style>
        /* Sanfter Übergang für das Hineinschieben der Menü-Ebenen */
        .slide-container {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body class="bg-slate-955 text-slate-100 font-sans min-h-screen flex flex-col justify-between overflow-hidden">

    <!-- Zentrierte, leicht transparente Erfolgsmeldung -->
    <div id="successToast" class="fixed inset-0 flex items-center justify-center pointer-events-none opacity-0 transition-opacity duration-[500ms] z-50">
        <div class="bg-slate-900/90 border border-emerald-500/50 text-emerald-400 px-6 py-3 rounded-2xl shadow-2xl backdrop-blur-md flex items-center space-x-2 font-medium">
            <span>✅</span>
            <span>Änderungen erfolgreich gespeichert</span>
        </div>
    </div>

    <!-- 1. Dynamische Kopfzeile (Header) -->
    <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex justify-between items-center z-50">
        <div class="flex items-center space-x-4">
            <button id="backButton" onclick="navigateBack()" class="hidden px-3 py-1.5 bg-slate-800 hover:bg-slate-700 active:scale-95 rounded-lg text-xs font-semibold text-slate-300 transition">
                ← Zurück
            </button>
            <h1 id="menuTitle" class="text-xl font-bold tracking-tight">KlassID Menü</h1>
        </div>
        
        <button onclick="resetToHome()" class="w-10 h-10 bg-indigo-600 hover:bg-indigo-500 active:scale-95 rounded-full flex items-center justify-center text-lg shadow-md transition" title="Zurück zur Hauptübersicht">
            🏠
        </button>
    </header>

    <!-- 2. Hauptbereich mit dem Slider-Fenster -->
    <main class="flex-1 relative w-full max-w-md mx-auto overflow-hidden my-4 bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl">
        <div id="slideWrapper" class="slide-container flex w-[300%] h-full">
            
            <!-- EBENE 1: Hauptbereiche -->
            <section id="level1" class="w-full p-6 space-y-3 flex flex-col justify-start">
                <!-- Wird live von Django befüllt -->
            </section>

            <!-- EBENE 2: Untermenüs -->
            <section id="level2" class="w-full p-6 space-y-3 flex flex-col justify-start">
                <!-- Wird live von Django befüllt -->
            </section>

            <!-- EBENE 3: Zielformular mit integrierter Tabbar -->
            <section id="level3" class="w-full flex flex-col h-full">
                <nav class="flex border-b border-slate-800 bg-slate-900/50 interstate sticky top-0 px-4" aria-label="Formularbereiche">
                    <!-- Wird live von Django befüllt -->
                </nav>
                <div class="p-6 space-y-4 flex-1 overflow-y-auto">
                    <!-- Wird live von Django befüllt -->
                </div>
            </section>

        </div>
    </main>

    <!-- 3. Smartphone App-Style Bottom-Navigation -->
    <footer class="bg-slate-900 border-t border-slate-800 p-2 grid grid-cols-5 text-center text-[10px] text-slate-400 z-50">
        <button onclick="resetToHome()" class="flex flex-col items-center justify-center p-2 hover:text-white transition">
            <span class="text-lg">🏠</span><span>Home</span>
        </button>
        <button class="flex flex-col items-center justify-center p-2 hover:text-white transition">
            <span class="text-lg">📅</span><span>Kalender</span>
        </button>
        <button class="flex flex-col items-center justify-center p-2 hover:text-white transition">
            <span class="text-lg">💬</span><span>Chat</span>
        </button>
        <button class="flex flex-col items-center justify-center p-2 hover:text-white transition">
            <span class="text-lg">🚗</span><span>Mobilität</span>
        </button>
        <button onclick="resetToHome()" class="flex flex-col items-center justify-center p-2 text-indigo-400 font-bold transition">
            <span class="text-lg">☰</span><span>Mehr</span>
        </button>
    </footer>

    <!-- LOGIK FÜR DIE LIVE-ANBINDUNG -->
    <script>
        let menuData = [];
        let currentLevel = 1;
        let selectedGroup = null;
        let currentPersonName = "";
        let currentPersonGender = "male";

        // Daten live über deinen neuen Django-Endpunkt holen
        async function loadMenu() {
            try {
                const response = await fetch('/api/portal-navigation/');
                const data = await response.json();
                
                menuData = data.menu;
                // Familiendaten für Ebene 3 global zwischenspeichern
                window.globalFamilyData = data.family;

                renderLevel1();
            } catch (error) {
                console.error("Fehler beim Laden der Django-Daten:", error);
            }
        }

        function renderLevel1() {
            const container = document.getElementById('level1');
            container.innerHTML = '<p class="text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Alle Bereiche</p>';

            menuData.forEach((item, index) => {
                const btn = document.createElement('button');
                btn.className = "w-full p-4 bg-slate-800 hover:bg-slate-700/80 rounded-xl text-left font-medium flex justify-between items-center transition border border-transparent hover:border-slate-700";
                btn.innerHTML = `<span>${item.icon} ${item.name}</span> <span class="text-slate-500">➔</span>`;
                btn.onclick = () => navigateToLevel2(index);
                container.appendChild(btn);
            });
        }

        function navigateToLevel2(index) {
            currentLevel = 2;
            selectedGroup = menuData[index];
            
            const container = document.getElementById('level2');
            container.innerHTML = `<p class="text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">${selectedGroup.name}</p>`;

            selectedGroup.children.forEach(child => {
                const btn = document.createElement('button');
                btn.className = "w-full p-4 bg-slate-800 hover:bg-slate-700/80 rounded-xl text-left font-medium flex justify-between items-center transition border border-transparent hover:border-slate-700";
                btn.innerHTML = `<span>${child.icon} ${child.name}</span> <span class="text-slate-500">➔</span>`;
                btn.onclick = () => navigateToLevel3(child);
                container.appendChild(btn);
            });

            document.getElementById('slideWrapper').style.transform = 'translateX(-33.333%)';
            document.getElementById('backButton').classList.remove('hidden');
            document.getElementById('menuTitle').textContent = selectedGroup.name;

            setTimeout(() => {
                const firstBtn = container.querySelector('button');
                if (firstBtn) firstBtn.focus();
            }, 150);
        }

        function navigateToLevel3(selectedChild) {
            currentLevel = 3;
            const tabContainer = document.querySelector('#level3 nav');
            const formContainer = document.querySelector('#level3 .space-y-4');
            
            tabContainer.innerHTML = '';
            formContainer.innerHTML = '';
            let tabsToRender = [];
            
            if (selectedChild.name === "Mein Profil") {
                tabsToRender = [{ name: "Persönliche Daten", active: true }, { name: "Sichtbarkeit", active: false }, { name: "Wohnbereich", active: false }];
                formContainer.innerHTML = `
                    <div class="space-y-1">
                        <label class="text-xs text-slate-400 font-medium">Anzeigename im Portal</label>
                        <input type="text" value="Björn" class="w-full p-3 bg-slate-950 border border-slate-800 rounded-xl focus:border-indigo-500 focus:outline-none text-white">
                    </div>`;
            } 
            else if (selectedChild.name === "Familie") {
                tabsToRender = [{ name: "Mitglieder", active: true }, { name: "Einladungen", active: false }];
                formContainer.innerHTML = '<p class="text-xs font-bold uppercase tracking-wider text-slate-500 mb-4">Deine Familie verwalten</p><div class="space-y-4">';
                
                // Nutzt die echten Live-Daten aus Django!
                const familyMembers = window.globalFamilyData || [];
                familyMembers.forEach(person => {
                    let colorClasses = "bg-slate-900 border-slate-800 text-indigo-400";
                    if (person.role.includes("Tochter") || person.gender === "female") {
                        colorClasses = "bg-purple-950/40 border-purple-900/50 text-purple-400 hover:border-purple-500";
                    } else if (person.role.includes("Sohn")) {
                        colorClasses = "bg-emerald-950/40 border-emerald-900/50 text-emerald-400 hover:border-emerald-500";
                    }

                    const avatarHTML = person.image 
                        ? `<img src="${person.image}" class="w-12 h-12 rounded-full object-cover border border-slate-700 shadow-inner" alt="${person.name}">`
                        : `<div class="w-12 h-12 rounded-full bg-slate-800/80 flex items-center justify-center font-bold text-lg border border-slate-700 shadow-inner">${person.initial.charAt(0)}</div>`;

                    formContainer.innerHTML += `
                        <div onclick="openPersonProfile('${person.name}', '${person.gender}')" class="group p-4 rounded-2xl border flex items-center justify-between cursor-pointer transition-all duration-200 hover:shadow-lg ${colorClasses}">
                            <div class="flex items-center space-x-4">
                                ${avatarHTML}
                                <div>
                                    <span class="font-bold text-base block text-white group-hover:text-current transition">${person.name}</span>
                                    <span class="text-xs text-slate-400">${person.role}</span>
                                </div>
                            </div>
                            <span class="text-slate-600 group-hover:text-current group-hover:translate-x-1 transition-all text-xl">➔</span>
                        </div>`;
                });
                formContainer.innerHTML += '</div>';
            } 
            else if (selectedChild.name === "Themes") {
                tabsToRender = [{ name: "Theme-Auswahl", active: true }, { name: "Eigene Vorlagen", active: false }];
                formContainer.innerHTML = `
                    <p class="text-sm text-slate-300">Wähle dein bevorzugtes Design für KlassID aus.</p>
                    <div class="p-4 bg-slate-950 border border-indigo-500 rounded-xl mt-2">
                        <span class="font-bold block">🌌 Midnight Focus</span>
                        <span class="text-xs text-slate-400">Aktuell aktiv und augenschonend</span>
                    </div>`;
            } else {
                tabsToRender = [{ name: "Übersicht", active: true }];
                formContainer.innerHTML = `<p class="text-sm text-slate-400">Bereich "${selectedChild.name}" wird geladen...</p>`;
            }

            tabsToRender.forEach(tab => {
                const tabBtn = document.createElement('button');
                tabBtn.className = tab.active ? "py-4 px-3 border-b-2 border-indigo-500 font-semibold text-sm text-white" : "py-4 px-3 border-b-2 border-transparent text-sm text-slate-400";
                tabBtn.textContent = tab.name;
                tabContainer.appendChild(tabBtn);
            });

            appendActionButtons(formContainer);
            document.getElementById('slideWrapper').style.transform = 'translateX(-66.666%)';
            document.getElementById('menuTitle').textContent = selectedChild.name;

            setTimeout(() => {
                const firstTab = tabContainer.querySelector('button');
                if (firstTab) firstTab.focus();
            }, 150);
        }

        function openPersonProfile(personName, gender) {
            currentPersonName = personName;
            currentPersonGender = gender;
            renderPersonProfileWithTab("Stammdaten");
        }

        function renderPersonProfileWithTab(activeTabName) {
            const tabContainer = document.querySelector('#level3 nav');
            const formContainer = document.querySelector('#level3 .space-y-4');
            document.getElementById('menuTitle').textContent = currentPersonName;
            
            const personTabs = [{ name: "Stammdaten" }, { name: "Datenschutz" }, { name: "Einwilligungen" }];
            tabContainer.innerHTML = '';
            personTabs.forEach(tab => {
                const isCurrent = (tab.name === activeTabName);
                const tabBtn = document.createElement('button');
                tabBtn.className = isCurrent ? "py-4 px-3 border-b-2 border-indigo-500 font-semibold text-sm text-white" : "py-4 px-3 border-b-2 border-transparent text-sm text-slate-400";
                tabBtn.textContent = tab.name;
                tabBtn.onclick = () => renderPersonProfileWithTab(tab.name);
                tabContainer.appendChild(tabBtn);
            });
            
            formContainer.innerHTML = '';
            if (activeTabName === "Stammdaten") {
                formContainer.innerHTML = `
                    <p class="text-xs font-bold uppercase tracking-wider text-slate-500">Stammdaten & Profilbild</p>
                    <div class="space-y-4">
                        <div class="flex items-center space-x-4 p-3 bg-slate-950 rounded-xl border border-slate-800">
                            <div id="avatarPreviewContainer" class="w-14 h-14 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center font-bold text-xl text-slate-400 overflow-hidden">
                                <span id="avatarPreviewText">${currentPersonName.charAt(0)}</span>
                                <img id="avatarPreviewImg" class="hidden w-full h-full object-cover" alt="Vorschau">
                            </div>
                            <div class="flex-1">
                                <label class="block text-xs text-slate-400 font-medium mb-1">Profilbild ändern</label>
                                <input type="file" id="avatarFileInput" accept="image/*" onchange="previewProfileImage(this)" class="block w-full text-xs text-slate-500 file:mr-4 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-slate-800 file:text-slate-200 cursor-pointer">
                            </div>
                        </div>
                        <div class="space-y-1">
                            <label class="text-xs text-slate-400 font-medium">Anzeigename im Portal</label>
                            <input type="text" value="${currentPersonName}" class="w-full p-3 bg-slate-950 border border-slate-800 rounded-xl text-white focus:outline-none">
                        </div>
                        <div class="space-y-1">
                            <label class="text-xs text-slate-400 font-medium block mb-1">Geschlecht</label>
                            <div class="grid grid-cols-3 gap-2">
                                <label class="flex items-center justify-center p-3 bg-slate-950 border ${currentPersonGender === 'female' ? 'border-purple-500 text-purple-400' : 'border-slate-800'} rounded-xl cursor-pointer text-sm">♀️ Weiblich</label>
                                <label class="flex items-center justify-center p-3 bg-slate-950 border ${currentPersonGender === 'male' ? 'border-emerald-500 text-emerald-400' : 'border-slate-800'} rounded-xl cursor-pointer text-sm">♂️ Männlich</label>
                                <label class="flex items-center justify-center p-3 bg-slate-950 border border-slate-800 rounded-xl cursor-pointer text-sm">⚪ Divers</label>
                            </div>
                        </div>
                    </div>`;
            } else {
                formContainer.innerHTML = `<p class="text-sm text-slate-400">Bereich ${activeTabName} geladen.</p>`;
            }
            appendActionButtons(formContainer);
        }

        function previewProfileImage(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('avatarPreviewImg').src = e.target.result;
                    document.getElementById('avatarPreviewText').classList.add('hidden');
                    document.getElementById('avatarPreviewImg').classList.remove('hidden');
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        // 3. NAVIGATIONSTASTEN (ZURÜCK / HOME)
        function navigateBack() {
            if (currentLevel === 3) {
                const groupIndex = menuData.indexOf(selectedGroup);
                navigateToLevel2(groupIndex);
            } else if (currentLevel === 2) {
                resetToHome();
            }
        }

        function resetToHome() {
            currentLevel = 1;
            document.getElementById('slideWrapper').style.transform = 'translateX(0%)';
            document.getElementById('backButton').classList.add('hidden');
            document.getElementById('menuTitle').textContent = "KlassID Menü";
            const firstBtn = document.querySelector('#level1 button');
            if (firstBtn) firstBtn.focus();
        }

        function appendActionButtons(container) {
            const btnWrapper = document.createElement('div');
            btnWrapper.className = "flex space-x-3 pt-4 border-t border-slate-800";
            btnWrapper.innerHTML = `
                <button type="button" onclick="navigateBack()" class="flex-1 py-3 bg-slate-800 hover:bg-slate-700 rounded-xl font-medium transition">Abbrechen</button>
                <button type="button" onclick="saveForm()" class="flex-1 py-3 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-bold transition">Speichern</button>`;
            container.appendChild(btnWrapper);
        }

        function saveForm() {
            const toast = document.getElementById('successToast');
            toast.classList.remove('opacity-0');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0');
            }, 2000);
            setTimeout(() => { navigateBack(); }, 2500);
        }

        window.onload = loadMenu;
    </script>
</body>
</html>
