{% extends "base.html" %}{% block content %}<section class="flow-page"><a class="back-link" href="/accounts/login/">← Zur Anmeldung</a><h1>Bei KlassID registrieren</h1><p>Dein Konto erhält erst nach E-Mail-Prüfung und Freigabe durch die Klassenadministration Zugriff.</p><form method="post" class="card form-stack">{% csrf_token %}<label>Vorname<input name="first_name" autocomplete="given-name" required maxlength="100"></label><label>Nachname<input name="last_name" autocomplete="family-name" required maxlength="100"></label><label>E-Mail<input name="email" type="email" autocomplete="email" required></label><label>Passwort<input name="password" type="password" autocomplete="new-password" required></label><button class="button button-primary">Registrierung absenden</button></form></section>{% endblock %}
