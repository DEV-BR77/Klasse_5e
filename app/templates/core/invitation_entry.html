{% extends "base.html" %}
{% block content %}<section class="public-page invitation-entry"><p class="eyebrow">Geschützter Zugang</p><h1>Einladungscode eingeben</h1><p class="lede">Dein persönlicher Code führt dich direkt zur Anmeldung für deine Schule und Klasse.</p>{% if error %}<p class="notice notice-error">{{ error }}</p>{% endif %}<form method="post" class="card form-stack">{% csrf_token %}<label for="invitation-code">Einladungscode</label><input id="invitation-code" name="code" autocomplete="one-time-code" required autofocus><button class="button button-primary" type="submit">Code prüfen</button></form><p><a class="back-link" href="{% url 'account_login' %}">← Zur Anmeldung</a></p></section>{% endblock %}
